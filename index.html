<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OC 印象饮品测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; min-height: 100%;
  background: #111; color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.7; overflow-x: hidden;
}
body { padding-bottom: 60px; }

.pixel-grid {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.08;
  background-image:
    linear-gradient(rgba(255,255,255,0.6) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.6) 1px, transparent 1px);
  background-size: 24px 24px;
}

.page { position: relative; z-index: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 32px 20px 80px; display: none; }
.page.active { display: block; animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.watermark { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 11px; letter-spacing: 1px; color: rgba(255,255,255,0.28); pointer-events: none; z-index: 999; }

#pageHome { text-align: center; padding-top: 15vh; }
.home-title { font-size: 26px; font-weight: 700; letter-spacing: 2px; margin-bottom: 24px; color: #fff; text-shadow: 0 0 18px rgba(255,255,255,0.18); }
.home-intro { font-size: 14px; line-height: 2; color: rgba(255,255,255,0.78); text-align: left; margin-bottom: 36px; padding: 0 4px; }
.home-input { width: 100%; padding: 14px 16px; font-size: 15px; color: #fff; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.22); outline: none; margin-bottom: 22px; font-family: inherit; transition: border-color 0.25s ease, background 0.25s ease; }
.home-input::placeholder { color: rgba(255,255,255,0.35); }
.home-input:focus { border-color: rgba(255,255,255,0.55); background: rgba(255,255,255,0.1); }
.home-btn { display: inline-block; width: 100%; padding: 16px 20px; font-size: 16px; font-weight: 600; letter-spacing: 2px; color: #111; background: #f5f5f5; border: none; cursor: pointer; font-family: inherit; transition: transform 0.2s ease; }
.home-btn:active { transform: scale(0.97); }
.home-deco { margin-top: 40px; display: flex; justify-content: center; gap: 18px; opacity: 0.5; }
.home-deco svg { width: 36px; height: 36px; }

#pageQuiz { padding-top: 24px; transition: background 0.5s ease; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 14px; }
.quiz-progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.12); margin-bottom: 34px; overflow: hidden; }
.quiz-progress-fill { height: 100%; width: 0%; background: rgba(255,255,255,0.85); transition: width 0.35s ease; }
.quiz-question { font-size: 18px; font-weight: 600; line-height: 1.8; text-align: left; margin-bottom: 30px; color: #fff; min-height: 64px; }
.quiz-options { display: flex; flex-direction: column; gap: 14px; }
.option-btn { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 14px 16px; text-align: left; font-size: 15px; line-height: 1.7; color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.18); cursor: pointer; font-family: inherit; transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease; }
.option-btn:active { transform: scale(0.985); }
.option-btn.selected { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.85); box-shadow: 0 0 0 1px rgba(255,255,255,0.35), 0 0 18px rgba(255,255,255,0.15); }
.option-index { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin-top: 2px; font-size: 12px; font-weight: 700; color: #111; background: rgba(255,255,255,0.85); border: 2px solid rgba(255,255,255,0.9); box-shadow: 2px 2px 0 rgba(0,0,0,0.25); }
.option-text { flex: 1; }
.quiz-nav { display: flex; justify-content: space-between; gap: 14px; margin-top: 30px; }
.quiz-nav button { flex: 1; padding: 12px 16px; font-size: 14px; color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.22); cursor: pointer; font-family: inherit; transition: background 0.2s ease, border-color 0.2s ease; }
.quiz-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
.quiz-nav button:not(:disabled):active { background: rgba(255,255,255,0.16); }

#pageResult { padding-top: 30px; transition: background 0.6s ease; position: relative;
  --main: #888; --sub: #ccc;
  --text: #fff;
  --text-soft: rgba(255,255,255,0.85);
  --card: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.22);
  --btn-bg: rgba(255,255,255,0.06);
  --btn-border: rgba(255,255,255,0.3);
  --shadow: rgba(0,0,0,0.25);
  color: var(--text);
}
#pageResult .pixel-grid { display: none; }

.result-grid {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.16;
  background-image:
    linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px);
  background-size: 26px 26px;
  display: none;
}
#pageResult.active .result-grid { display: block; }

.cute-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; display: none; }
#pageResult.style-cute .cute-deco { display: block; }
.cute-deco .dot {
  position: absolute; width: 4px; height: 4px; background: #fff; opacity: 0.55;
  animation: cuteFloat linear infinite;
}
@keyframes cuteFloat {
  0% { transform: translateY(0) scale(1); opacity: 0.55; }
  50% { opacity: 0.25; }
  100% { transform: translateY(-90px) scale(0.5); opacity: 0; }
}

.mature-deco { position: fixed; inset: 0; pointer-events: none; z-index: 0; display: none; }
#pageResult.style-mature .mature-deco { display: block; }
.mature-deco .spark {
  position: absolute; width: 2px; height: 2px; background: #fff; opacity: 0.4;
  animation: matureFloat linear infinite;
}
@keyframes matureFloat {
  0% { transform: translateY(0); opacity: 0.4; }
  50% { opacity: 0.15; }
  100% { transform: translateY(-60px); opacity: 0; }
}

.result-rare-tag {
  display: inline-block; padding: 4px 12px; font-size: 12px; letter-spacing: 2px;
  color: #fff; background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.6);
  box-shadow: 2px 2px 0 rgba(0,0,0,0.25); margin-bottom: 16px;
  animation: rareGlow 2.2s ease-in-out infinite;
}
@keyframes rareGlow {
  0%,100% { box-shadow: 2px 2px 0 rgba(0,0,0,0.25), 0 0 10px rgba(255,255,255,0.2); }
  50% { box-shadow: 2px 2px 0 rgba(0,0,0,0.25), 0 0 24px rgba(255,255,255,0.65); }
}

.result-title { font-size: 20px; font-weight: 700; line-height: 1.6; text-align: center; margin-bottom: 20px; color: var(--text); }
#pageResult.style-cute .result-title { text-shadow: 0 0 14px rgba(255,255,255,0.35); }
#pageResult.style-mature .result-title { letter-spacing: 4px; text-shadow: 0 0 10px rgba(255,255,255,0.18); }
#pageResult.hidden-mode .result-title {
  background: linear-gradient(90deg, #fff 0%, #ffe6a7 40%, #fff 60%, #fff 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: titleShine 2.6s linear infinite;
}
@keyframes titleShine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.result-pixel-wrap { display: flex; justify-content: center; margin-bottom: 18px; position: relative; }
.result-pixel-wrap svg { width: 120px; height: 120px; }
#pageResult.style-cute .result-pixel-wrap::before,
#pageResult.style-cute .result-pixel-wrap::after {
  content: "✦"; position: absolute; color: #fff; opacity: 0.7; font-size: 14px;
  animation: cuteFloat 3s linear infinite;
}
#pageResult.style-cute .result-pixel-wrap::before { left: 22%; top: 6px; }
#pageResult.style-cute .result-pixel-wrap::after { right: 22%; bottom: 8px; animation-delay: 1.2s; }

.result-score { text-align: center; font-size: 13px; letter-spacing: 1px; color: var(--text-soft); margin-bottom: 22px; }
.result-tagline { text-align: center; margin-bottom: 20px; }
.result-tagline .tag-label { display: inline-block; padding: 3px 10px; font-size: 12px; letter-spacing: 2px; color: var(--text); border: 2px solid var(--border); background: var(--card); margin-bottom: 10px; }
#pageResult.style-cute .result-tagline .tag-label { border-radius: 999px; border-color: rgba(255,255,255,0.55); }
#pageResult.style-mature .result-tagline .tag-label { border-color: rgba(255,255,255,0.35); letter-spacing: 4px; }
.result-tagline .tag-sentence { font-size: 15px; line-height: 1.9; color: var(--text); }
.result-keywords { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; }
.keyword-chip { padding: 5px 14px; font-size: 13px; letter-spacing: 1px; color: var(--text); background: var(--card); border: 2px solid var(--border); box-shadow: 2px 2px 0 var(--shadow); }
#pageResult.style-cute .keyword-chip { border-radius: 999px; }
#pageResult.style-mature .keyword-chip { border-radius: 0; letter-spacing: 2px; }

.result-card {
  width: 90%; margin: 0 auto 20px; padding: 20px 18px;
  background: var(--card); border: 2px solid var(--border);
  box-shadow: 3px 3px 0 var(--shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  opacity: 0; transform: translateY(14px);
}
#pageResult.active .result-card { animation: cardIn 0.6s ease forwards; }
#pageResult.active .result-card:nth-of-type(1) { animation-delay: 0.05s; }
#pageResult.active .result-card:nth-of-type(2) { animation-delay: 0.15s; }
#pageResult.active .result-card:nth-of-type(3) { animation-delay: 0.25s; }
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

#pageResult.style-cute .result-card { border-radius: 18px; }
#pageResult.style-mature .result-card {
  border-radius: 4px;
  clip-path: polygon(0 8px, 8px 8px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px));
}
.result-card:active { transform: translateY(-2px); }
.card-title { font-size: 15px; font-weight: 700; letter-spacing: 2px; margin-bottom: 14px; color: var(--text); text-align: left; }
#pageResult.style-mature .card-title { letter-spacing: 4px; }
.card-text { font-size: 14.5px; line-height: 1.95; color: var(--text-soft); text-align: left; }
.card-text p { margin-bottom: 12px; }
.card-text p:last-child { margin-bottom: 0; }
.relation-block { margin-bottom: 16px; }
.relation-block:last-child { margin-bottom: 0; }
.relation-label { display: block; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--text); margin-bottom: 6px; }
.recipe-ingredients, .recipe-steps { margin: 0; padding: 0; list-style: none; }
.recipe-ingredients li, .recipe-steps li { font-size: 14px; line-height: 1.85; color: var(--text-soft); padding-left: 18px; position: relative; margin-bottom: 6px; }
.recipe-ingredients li::before { content: "■"; position: absolute; left: 0; top: 0; font-size: 8px; line-height: 1.85; color: var(--text-soft); }
.recipe-steps li::before { content: attr(data-step); position: absolute; left: 0; top: 0; font-size: 12px; line-height: 1.85; color: var(--text-soft); }
.recipe-sub-title { font-size: 13px; font-weight: 700; letter-spacing: 1px; color: var(--text); margin: 14px 0 8px; }
.recipe-sub-title:first-child { margin-top: 0; }

.result-similar-title { text-align: center; font-size: 14px; letter-spacing: 2px; color: var(--text-soft); margin: 34px 0 16px; }
.similar-scroll { width: 100%; overflow-x: auto; overflow-y: hidden; white-space: nowrap; padding-bottom: 10px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.similar-scroll::-webkit-scrollbar { display: none; }
.similar-track { display: inline-flex; gap: 16px; padding: 0 4px; animation: similarScroll 28s linear infinite; }
@keyframes similarScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
.similar-item { flex: 0 0 auto; width: 84px; text-align: center; }
.similar-item svg { width: 64px; height: 64px; display: block; margin: 0 auto 6px; }
.similar-name { font-size: 13px; line-height: 1.5; color: var(--text-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 84px; }

.result-restart {
  display: block; width: 90%; margin: 36px auto 20px; padding: 15px 20px;
  font-size: 15px; letter-spacing: 2px; color: var(--text);
  background: var(--btn-bg); border: 2px solid var(--btn-border);
  cursor: pointer; font-family: inherit; transition: background 0.2s ease, transform 0.15s ease;
}
#pageResult.style-cute .result-restart { border-radius: 999px; }
#pageResult.style-cute .result-restart:active { transform: scale(0.96); }
#pageResult.style-mature .result-restart { border-radius: 4px; letter-spacing: 4px; }
.result-restart:active { background: rgba(255,255,255,0.16); }

.rare-particles { position: fixed; inset: 0; pointer-events: none; z-index: 2; display: none; }
.rare-particles.active { display: block; }
.rare-particle { position: absolute; width: 3px; height: 3px; background: #fff; opacity: 0.8; animation: particleFloat linear infinite; box-shadow: 0 0 6px rgba(255,255,255,0.8); }
@keyframes particleFloat {
  0% { transform: translateY(0) scale(1); opacity: 0.9; }
  50% { opacity: 0.4; }
  100% { transform: translateY(-140px) scale(0.3); opacity: 0; }
}

#pageResult.hidden-mode { animation: bgBreath 6s ease-in-out infinite; }
@keyframes bgBreath {
  0%,100% { filter: brightness(1); }
  50% { filter: brightness(1.12); }
}

.rare-burst { position: fixed; left: 50%; top: 40%; width: 0; height: 0; z-index: 3; pointer-events: none; }
.rare-burst span {
  position: absolute; left: 0; top: 0; width: 4px; height: 4px; background: #fff;
  border-radius: 50%; opacity: 0;
  animation: burst 1.2s ease-out forwards;
}
@keyframes burst {
  0% { transform: translate(0,0) scale(1); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
}

@media (max-width: 380px) {
  .home-title { font-size: 22px; }
  .quiz-question { font-size: 16px; }
  .option-btn { font-size: 14px; }
  .result-title { font-size: 18px; }
}
@media (min-width: 768px) {
  .page { max-width: 560px; padding-top: 50px; }
  .home-title { font-size: 30px; }
  .quiz-question { font-size: 20px; }
}
</style>
</head>
<body>

<div class="pixel-grid"></div>
<div class="rare-particles" id="rareParticles"></div>
<div class="rare-burst" id="rareBurst"></div>

<div class="page active" id="pageHome">
  <h1 class="home-title">OC 印象饮品测试</h1>
  <p class="home-intro">每一个角色，都拥有一个属于自己的味道……有的是夏天，有的是冬天，有甜有涩，有酸有苦，所以，Ta 会是你想象中的那个口味吗？</p>
  <input type="text" class="home-input" id="ocNameInput" placeholder="在此写下，Ta 的名字" maxlength="20" autocomplete="off">
  <button class="home-btn" id="startBtn">开始调制</button>
  <div class="home-deco">
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="4" y="2" width="8" height="2" fill="#f5f5f5"/><rect x="3" y="4" width="10" height="8" fill="none" stroke="#f5f5f5" stroke-width="1"/><rect x="4" y="6" width="8" height="6" fill="#f5f5f5" opacity="0.35"/><rect x="6" y="0" width="1" height="3" fill="#f5f5f5"/></svg>
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="4" y="3" width="8" height="10" fill="none" stroke="#f5f5f5" stroke-width="1"/><rect x="5" y="5" width="6" height="7" fill="#f5f5f5" opacity="0.3"/><rect x="7" y="1" width="1" height="3" fill="#f5f5f5"/><rect x="8" y="1" width="3" height="1" fill="#f5f5f5"/></svg>
    <svg viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="4" width="10" height="8" fill="none" stroke="#f5f5f5" stroke-width="1"/><rect x="4" y="6" width="8" height="5" fill="#f5f5f5" opacity="0.28"/><rect x="6" y="1" width="1" height="4" fill="#f5f5f5"/></svg>
  </div>
</div>

<div class="page" id="pageQuiz">
  <div class="quiz-top"><span id="quizCounter">第 1 / 24 题</span><span id="quizGroupName"></span></div>
  <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quizProgressFill"></div></div>
  <div class="quiz-question" id="quizQuestion"></div>
  <div class="quiz-options" id="quizOptions"></div>
  <div class="quiz-nav"><button id="prevBtn" disabled>上一题</button><button id="nextBtn" disabled>下一题</button></div>
</div>

<div class="page" id="pageResult">
  <div class="result-grid"></div>
  <div class="cute-deco" id="cuteDeco"></div>
  <div class="mature-deco" id="matureDeco"></div>

  <div id="resultRareTagWrap"></div>
  <h2 class="result-title" id="resultTitle"></h2>
  <div class="result-pixel-wrap" id="resultPixelWrap"></div>
  <div class="result-score" id="resultScore"></div>
  <div class="result-tagline" id="resultTagline"></div>
  <div class="result-keywords" id="resultKeywords"></div>
  <div class="result-card" id="cardAnalysis"><div class="card-title">心理分析</div><div class="card-text" id="analysisText"></div></div>
  <div class="result-card" id="cardRelation"><div class="card-title">关系模式</div><div class="card-text" id="relationText"></div></div>
  <div class="result-card" id="cardRecipe"><div class="card-title">配方卡</div><div class="card-text" id="recipeText"></div></div>
  <div class="result-similar-title">或许你还会是……</div>
  <div class="similar-scroll" id="similarScroll"><div class="similar-track" id="similarTrack"></div></div>
  <button class="result-restart" id="restartBtn">重新调制</button>
</div>

<div class="watermark">一粒沙尘 制作</div>

<script>
const questions = [
  { id: 1, group: "A", groupName: "外在气质", text: "Ta 给人的第一眼，更适合用哪种颜色氛围来描述？", options: [
    { text: "明亮的——像干净清澈的湖水，偏浅色", score: { bright: 3, refreshing: 2, sweet: 1, soft: 1 } },
    { text: "浓郁的——如同色彩饱和的画作，偏暖色", score: { thick: 3, sweet: 2, hot: 1, mature: 1 } },
    { text: "冷调感——低饱和的天空，偏灰蓝", score: { cold: 3, dark: 2, bitter: 2, distance: 1 } },
    { text: "撞色——跳出规则的，不被单一感受约束", score: { complex: 3, exotic: 2, bright: 1, premium: 1 } }
  ]},
  { id: 2, group: "A", groupName: "外在气质", text: "Ta 身上更常出现哪种质感？", options: [
    { text: "气泡感，像一只小鹿轻柔地跳跃", score: { sparkling: 3, refreshing: 2, cold: 1, bright: 1 } },
    { text: "奶感，宛如层层叠叠地厚实云朵", score: { creamy: 3, sweet: 2, thick: 2, soft: 1 } },
    { text: "茶感，一汪碧绿色的清泉，干净，有回甘", score: { tea: 3, refreshing: 2, floral: 1, bitter: 1 } },
    { text: "烟熏感，凿不开的木头，木质，暗", score: { bitter: 3, dark: 2, spice: 2, mature: 1 } }
  ]},
  { id: 3, group: "A", groupName: "外在气质", text: "天气是一种感觉的直观表达，如果用一种天气描述Ta，你会选择？", options: [
    { text: "像夏天的午后，阳光耀眼", score: { hot: 3, bright: 3, fruity: 2, sparkling: 1 } },
    { text: "寒冷的冬夜，外面很冷，屋里却暖洋洋的", score: { hot: 2, thick: 3, mature: 2, creamy: 1 } },
    { text: "潮湿雨后，空气很干净，有青草的芬芳", score: { cold: 2, refreshing: 3, floral: 2, soft: 1 } },
    { text: "起雾的清晨，看不远，模模糊糊的", score: { dark: 3, complex: 2, bitter: 2, distance: 1 } }
  ]},
  { id: 4, group: "A", groupName: "外在气质", text: "如果用一段声音来讲述Ta，更像？", options: [
    { text: "气泡水开盖那一下，砰", score: { sparkling: 3, refreshing: 2, bright: 2, sweet: 1 } },
    { text: "咖啡机低沉的研磨声", score: { coffee: 3, bitter: 2, mature: 2, dark: 1 } },
    { text: "雨落在叶子上的声音", score: { floral: 2, refreshing: 2, soft: 2, tea: 1 } },
    { text: "老式唱片跳针的杂音", score: { complex: 3, dark: 2, exotic: 2, mature: 1 } }
  ]},
  { id: 5, group: "B", groupName: "性格内核", text: "Ta 生气的时候，更接近哪种状态？", options: [

/* ============================================================
   匹配算法 + 隐藏触发 + 答题逻辑
   ============================================================ */

const ALL_KEYS = [
  "cold", "hot", "sweet", "sour", "bitter", "sparkling",
  "creamy", "alcohol", "tea", "coffee", "fruity", "floral",
  "refreshing", "thick", "bright", "dark", "soft", "complex",
  "simple", "spice", "mature", "exotic", "premium", "distance"
];

let currentQuestionIndex = 0;
const userAnswers = {};
let ocName = "";
let currentResult = null;

/* ---------- 计算用户维度向量 ---------- */
function computeUserVector() {
  const vec = {};
  ALL_KEYS.forEach(k => vec[k] = 0);
  questions.forEach(q => {
    const ansIdx = userAnswers[q.id];
    if (ansIdx === undefined) return;
    const opt = q.options[ansIdx];
    if (!opt || !opt.score) return;
    for (const key in opt.score) {
      if (vec[key] === undefined) vec[key] = 0;
      vec[key] += opt.score[key];
    }
  });
  return vec;
}

/* ---------- 余弦相似度 ---------- */
function cosineSimilarity(vecA, vecB) {
  let dot = 0, magA = 0, magB = 0;
  const keys = new Set([...Object.keys(vecA), ...Object.keys(vecB)]);
  keys.forEach(k => {
    const a = vecA[k] || 0;
    const b = vecB[k] || 0;
    dot += a * b;
    magA += a * a;
    magB += b * b;
  });
  if (magA === 0 || magB === 0) return 0;
  return dot / (Math.sqrt(magA) * Math.sqrt(magB));
}

/* ---------- 隐藏款触发 ---------- */
function checkHiddenTriggers(userVec) {
  let wineScore = 0;
  let truffleScore = 0;
  questions.forEach(q => {
    const ansIdx = userAnswers[q.id];
    if (ansIdx === undefined) return;
    const opt = q.options[ansIdx];
    if (!opt || !opt.hidden) return;
    if (opt.hidden.wine) wineScore += opt.hidden.wine;
    if (opt.hidden.truffle) truffleScore += opt.hidden.truffle;
  });
  const alcoholHigh = (userVec.alcohol || 0) >= 3;
  const spiceHigh = (userVec.spice || 0) >= 3;
  const matureHigh = (userVec.mature || 0) >= 3;
  const complexHigh = (userVec.complex || 0) >= 5;
  const exoticHigh = (userVec.exotic || 0) >= 4;
  const premiumHigh = (userVec.premium || 0) >= 3;
  const wineTriggered = wineScore >= 1 && alcoholHigh && spiceHigh && matureHigh;
  const truffleTriggered = truffleScore >= 1 && complexHigh && exoticHigh && premiumHigh;
  return { wineTriggered, truffleTriggered };
}

/* ---------- 普通匹配：返回全部排名 ---------- */
function matchAllNormal(userVec) {
  const normalDrinks = drinks.filter(d => !d.hidden);
  const ranked = normalDrinks.map(d => ({
    drink: d,
    sim: cosineSimilarity(userVec, d.score)
  }));
  ranked.sort((a, b) => b.sim - a.sim);
  return ranked;
}

/* ---------- 普通款加权随机：前 8 名 ---------- */
/* 权重：26 / 18 / 14 / 11 / 9 / 8 / 7 / 7 */
function pickByWeightedTop(ranked) {
  const top = ranked.slice(0, 8);
  if (top.length === 0) return ranked[0].drink;
  const weights = [26, 18, 14, 11, 9, 8, 7, 7];
  let total = 0;
  for (let i = 0; i < top.length; i++) total += weights[i];
  let r = Math.random() * total;
  for (let i = 0; i < top.length; i++) {
    r -= weights[i];
    if (r <= 0) return top[i].drink;
  }
  return top[0].drink;
}

/* ---------- 匹配度显示 ---------- */
function displayMatchScore(sim) {
  let base = 80 + sim * 15;
  base = Math.max(80, Math.min(95, base));
  const jitter = (Math.random() * 6) - 3;
  let final = Math.round(base + jitter);
  final = Math.max(76, Math.min(98, final));
  return final;
}

/* ---------- 隐藏款稀有度 ---------- */
function displayRarePercent() {
  const val = (Math.random() * 2.5 + 0.5).toFixed(1);
  return `＜${val}%`;
}

/* ---------- 取相近款 ---------- */
function getSimilarDrinks(ranked, currentDrink, isHidden) {
  const count = isHidden ? 3 : 6;
  return ranked
    .filter(r => r.drink.id !== currentDrink.id)
    .slice(0, count)
    .map(r => r.drink);
}

/* ---------- 生成最终结果 ---------- */
function generateResult() {
  const userVec = computeUserVector();
  const { wineTriggered, truffleTriggered } = checkHiddenTriggers(userVec);

  let resultDrink = null;
  let isHidden = false;

  if (wineTriggered && truffleTriggered) {
    const pick = Math.random() < 0.5 ? 22 : 47;
    resultDrink = drinks.find(d => d.id === pick);
    isHidden = true;
  } else if (wineTriggered) {
    resultDrink = drinks.find(d => d.id === 22);
    isHidden = true;
  } else if (truffleTriggered) {
    resultDrink = drinks.find(d => d.id === 47);
    isHidden = true;
  } else {
    const ranked = matchAllNormal(userVec);
    resultDrink = pickByWeightedTop(ranked);
    isHidden = false;
    const similar = getSimilarDrinks(ranked, resultDrink, false);
    const matchedEntry = ranked.find(r => r.drink.id === resultDrink.id);
    const matchScore = displayMatchScore(matchedEntry ? matchedEntry.sim : ranked[0].sim);
    return { drink: resultDrink, isHidden: false, matchScore, similar };
  }

  const ranked = matchAllNormal(userVec);
  const similar = getSimilarDrinks(ranked, resultDrink, true);
  return { drink: resultDrink, isHidden: true, rarePercent: displayRarePercent(), similar };
}

/* ============================================================
   颜色工具
   ============================================================ */

function hexToRgb(hex) {
  hex = hex.replace("#", "");
  if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
  const num = parseInt(hex, 16);
  return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
}

function rgbToHex(r, g, b) {
  const to = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
  return "#" + to(r) + to(g) + to(b);
}

function mixColor(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  return rgbToHex(
    a.r + (b.r - a.r) * t,
    a.g + (b.g - a.g) * t,
    a.b + (b.b - a.b) * t
  );
}

function luminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

function readableText(hex) {
  return luminance(hex) > 0.6 ? "#111111" : "#ffffff";
}

function rgba(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

    bubbles = `<rect x="${cupX+10}" y="${liquidY+liquidH-14}" width="3" height="3" fill="#fff" opacity="0.6"><animate attributeName="y" values="${liquidY+liquidH-14};${liquidY+6};${liquidY+liquidH-14}" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="3.4s" repeatCount="indefinite"/></rect><rect x="${cupX+26}" y="${liquidY+liquidH-20}" width="3" height="3" fill="#fff" opacity="0.5"><animate attributeName="y" values="${liquidY+liquidH-20};${liquidY+10};${liquidY+liquidH-20}" dur="4.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="4.1s" repeatCount="indefinite"/></rect><rect x="${cupX+cupW-16}" y="${liquidY+liquidH-16}" width="3" height="3" fill="#fff" opacity="0.55"><animate attributeName="y" values="${liquidY+liquidH-16};${liquidY+8};${liquidY+liquidH-16}" dur="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.55;0;0.55" dur="3.8s" repeatCount="indefinite"/></rect>`;
  }

  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${steam}${straw}<rect x="${cupX}" y="${cupY}" width="${cupW}" height="${cupH}" fill="none" stroke="${main}" stroke-width="2"/>${liquidRects}${iceRects}${topDeco}${bubbles}<rect x="${cupX-4}" y="${cupY+cupH}" width="${cupW+8}" height="3" fill="${main}" opacity="0.6"/></svg>`;
}

/* ============================================================
   结果页渲染
   ============================================================ */

function renderResult(result) {
  currentResult = result;
  const { drink, isHidden, matchScore, rarePercent, similar } = result;
  const text = drinkTexts[drink.id];
  const displayName = ocName ? ocName : "你的 OC";

  applyResultTheme(drink, isHidden);

  document.getElementById("resultTitle").textContent = `${displayName} 的印象饮品——${drink.name}`;

  const rareWrap = document.getElementById("resultRareTagWrap");
  if (isHidden) {
    rareWrap.innerHTML = `<div style="text-align:center;margin-bottom:14px;"><span class="result-rare-tag">隐藏款</span></div>`;
  } else {
    rareWrap.innerHTML = "";
  }

  document.getElementById("resultPixelWrap").innerHTML = buildPixelSVG(drink, 120);

  const scoreEl = document.getElementById("resultScore");
  if (isHidden) {
    scoreEl.textContent = `稀有度 ${rarePercent}`;
  } else {
    scoreEl.textContent = `匹配度 ${matchScore}%`;
  }

  document.getElementById("resultTagline").innerHTML = `<div class="tag-label">${text.tagLabel}</div><div class="tag-sentence">${text.tagSentence}</div>`;
  document.getElementById("resultKeywords").innerHTML = text.keywords.map(k => `<span class="keyword-chip">${k}</span>`).join("");
  document.getElementById("analysisText").innerHTML = text.analysis.map(p => `<p>${p}</p>`).join("");

  document.getElementById("relationText").innerHTML = `
    <div class="relation-block"><span class="relation-label">别人和 Ta 相处时</span><p>${text.relation.others}</p></div>
    <div class="relation-block"><span class="relation-label">在亲密关系里</span><p>${text.relation.intimate}</p></div>
    <div class="relation-block"><span class="relation-label">适合什么样的人</span><p>${text.relation.suitable}</p></div>
  `;

  document.getElementById("recipeText").innerHTML = `
    <div class="recipe-sub-title">原料</div>
    <ul class="recipe-ingredients">${text.recipe.ingredients.map(i => `<li>${i}</li>`).join("")}</ul>
    <div class="recipe-sub-title">步骤</div>
    <ol class="recipe-steps">${text.recipe.steps.map((s, i) => `<li data-step="${i + 1}.">${s}</li>`).join("")}</ol>
  `;

  const track = document.getElementById("similarTrack");
  const loopList = [...similar, ...similar];
  track.innerHTML = loopList.map(d => `<div class="similar-item">${buildPixelSVG(d, 64)}<div class="similar-name">${d.name}</div></div>`).join("");

  renderRareParticles(isHidden);
}

/* ---------- 隐藏款粒子 + 星光炸开 ---------- */
function renderRareParticles(isHidden) {
  const particles = document.getElementById("rareParticles");
  const burst = document.getElementById("rareBurst");
  particles.innerHTML = "";
  burst.innerHTML = "";

  if (!isHidden) {
    particles.classList.remove("active");
    return;
  }

  particles.classList.add("active");
  for (let i = 0; i < 60; i++) {
    const p = document.createElement("div");
    p.className = "rare-particle";
    p.style.left = Math.random() * 100 + "%";
    p.style.top = Math.random() * 100 + "%";
    p.style.animationDuration = (3 + Math.random() * 5) + "s";
    p.style.animationDelay = (Math.random() * 3) + "s";
    p.style.width = p.style.height = (2 + Math.random() * 3) + "px";
    particles.appendChild(p);
  }

  for (let i = 0; i < 26; i++) {
    const s = document.createElement("span");
    const angle = (Math.PI * 2 * i) / 26;
    const dist = 80 + Math.random() * 80;
    s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    s.style.animationDelay = (Math.random() * 0.2) + "s";
    burst.appendChild(s);
  }
}

/* ============================================================
   答题页渲染
   ============================================================ */

function renderQuestion() {
  const q = questions[currentQuestionIndex];
  document.getElementById("quizCounter").textContent = `第 ${currentQuestionIndex + 1} / ${questions.length} 题`;
  document.getElementById("quizGroupName").textContent = q.groupName;
  document.getElementById("quizQuestion").textContent = q.text;
  document.getElementById("quizProgressFill").style.width = ((currentQuestionIndex) / questions.length) * 100 + "%";

  const optionsEl = document.getElementById("quizOptions");
  optionsEl.innerHTML = "";
  q.options.forEach((opt, idx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    if (userAnswers[q.id] === idx) btn.classList.add("selected");
    btn.innerHTML = `<span class="option-index">${idx + 1}</span><span class="option-text">${opt.text}</span>`;
    btn.addEventListener("click", () => selectOption(q.id, idx));
    optionsEl.appendChild(btn);
  });

  document.getElementById("prevBtn").disabled = currentQuestionIndex === 0;
  document.getElementById("nextBtn").disabled = userAnswers[q.id] === undefined;
  applyQuizGroupColor(q.group);
}

function selectOption(qId, optIdx) {
  userAnswers[qId] = optIdx;
  const buttons = document.querySelectorAll("#quizOptions .option-btn");
  buttons.forEach((b, i) => b.classList.toggle("selected", i === optIdx));
  document.getElementById("nextBtn").disabled = false;
  setTimeout(() => {
    if (currentQuestionIndex < questions.length - 1) {
      currentQuestionIndex++;
      renderQuestion();
    } else {
      showResult();
    }
  }, 400);
}

function goPrev() {
  if (currentQuestionIndex > 0) { currentQuestionIndex--; renderQuestion(); }
}

function goNext() {
  const q = questions[currentQuestionIndex];
  if (userAnswers[q.id] === undefined) return;
  if (currentQuestionIndex < questions.length - 1) {
    currentQuestionIndex++;
    renderQuestion();
  } else {
    showResult();
  }
}

function applyQuizGroupColor(group) {
  const colors = { A: "#1a1f2e", B: "#1f1a2e", C: "#1a2e24", D: "#2e1a1a", E: "#2a1a2e", F: "#1a2a2e" };
  document.getElementById("pageQuiz").style.background = colors[group] || "#111";
}

/* ============================================================
   页面切换 + 事件绑定 + 初始化
   ============================================================ */

function showResult() {
  const result = generateResult();
  document.getElementById("pageQuiz").classList.remove("active");
  document.getElementById("pageResult").classList.add("active");
  renderResult(result);
  window.scrollTo(0, 0);

  const scrollEl = document.getElementById("similarScroll");
  const track = document.getElementById("similarTrack");
  scrollEl.addEventListener("touchstart", () => { track.style.animationPlayState = "paused"; });
  scrollEl.addEventListener("touchend", () => { track.style.animationPlayState = "running"; });
  scrollEl.addEventListener("mouseenter", () => { track.style.animationPlayState = "paused"; });
  scrollEl.addEventListener("mouseleave", () => { track.style.animationPlayState = "running"; });
}

function showPage(pageId) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(pageId).classList.add("active");
  window.scrollTo(0, 0);
}

function startQuiz() {
  const input = document.getElementById("ocNameInput");
  ocName = (input.value || "").trim().slice(0, 8);
  currentQuestionIndex = 0;
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  document.getElementById("rareParticles").classList.remove("active");
  document.getElementById("rareParticles").innerHTML = "";
  document.getElementById("rareBurst").innerHTML = "";
  showPage("pageQuiz");
  renderQuestion();
}

function restart() {
  currentQuestionIndex = 0;
  Object.keys(userAnswers).forEach(k => delete userAnswers[k]);
  document.getElementById("ocNameInput").value = "";
  ocName = "";
  currentResult = null;
  document.getElementById("rareParticles").classList.remove("active");
  document.getElementById("rareParticles").innerHTML = "";
  document.getElementById("rareBurst").innerHTML = "";
  document.getElementById("resultRareTagWrap").innerHTML = "";
  document.getElementById("resultTitle").textContent = "";
  document.getElementById("resultPixelWrap").innerHTML = "";
  document.getElementById("resultScore").textContent = "";
  document.getElementById("resultTagline").innerHTML = "";
  document.getElementById("resultKeywords").innerHTML = "";
  document.getElementById("analysisText").innerHTML = "";
  document.getElementById("relationText").innerHTML = "";
  document.getElementById("recipeText").innerHTML = "";
  document.getElementById("similarTrack").innerHTML = "";
  document.getElementById("pageResult").classList.remove("hidden-mode", "style-cute", "style-mature");
  showPage("pageHome");
}

document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("restartBtn").addEventListener("click", restart);
document.getElementById("prevBtn").addEventListener("click", goPrev);
document.getElementById("nextBtn").addEventListener("click", goNext);

document.getElementById("ocNameInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") startQuiz();
});

(function init() {
  showPage("pageHome");
  const startBtn = document.getElementById("startBtn");
  startBtn.addEventListener("touchstart", () => { startBtn.style.transform = "scale(0.97)"; });
  startBtn.addEventListener("touchend", () => { startBtn.style.transform = "scale(1)"; });
})();

</script>
